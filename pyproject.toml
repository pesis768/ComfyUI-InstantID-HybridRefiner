version = "1.0.0"
license = { text = "Apache-2.0" }
dependencies = ["insightface>=0.7.3", "onnxruntime-gpu", "opencv-python-headless"]
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/pesis768/ComfyUI-InstantID-HybridRefiner"

[tool.comfy]
PublisherId = "comfyui-instantid-hybrid"
